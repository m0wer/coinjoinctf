name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Native crypto dependency
        run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev
      - name: Regtest node
        run: docker compose up -d
      - run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check src tests demo
          uv run ruff format --check src tests demo
          uv run mypy src
      - name: Wait for the node
        run: |
          for _ in $(seq 30); do
            uv run python -c "from coinjoinctf.rpc import node; node()" && exit 0
            sleep 2
          done
          exit 1
      # The full demo job below also builds and executes the ZK guest.
      - run: uv run pytest -q -ra

  demo:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    env:
      CTF_ZK_BIN: ${{ github.workspace }}/zk/target/release/ctf-zk
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev build-essential pkg-config
      - run: uv sync --extra dev
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup override set 1.97.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.risc0
            zk/target
          key: ${{ runner.os }}-risc0-3.0.6-rust-1.97.0-${{ hashFiles('zk/Cargo.lock', 'zk/methods/guest/Cargo.lock') }}
      - name: Pinned RISC Zero toolchain
        run: |
          cargo install rzup --version 0.5.2 --locked --no-default-features --features cli,install
          rzup install rust 1.97.0
          rzup install cargo-risczero 3.0.6
          rzup install r0vm 3.0.6
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
      - name: Build and check the guest
        run: |
          cargo fmt --manifest-path zk/Cargo.toml --all -- --check
          cargo fmt --manifest-path zk/methods/guest/Cargo.toml -- --check
          cargo build --manifest-path zk/Cargo.toml --release --locked
          test -x "$CTF_ZK_BIN"
          "$CTF_ZK_BIN" image-id
      - name: Regtest node
        run: |
          docker compose up -d
          for _ in $(seq 30); do
            uv run python -c "from coinjoinctf.rpc import node; node()" && exit 0
            sleep 2
          done
          exit 1
      - name: Full demo and regression suite (no skips)
        run: |
          mkdir -p tmp
          uv run pytest -q -ra --junitxml=tmp/ci-demo.xml
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("tmp/ci-demo.xml").getroot()
          assert not root.findall(".//testcase/skipped"), "Required CI tests skipped"
          PY
      - name: Stop the node
        if: always()
        run: docker compose down
