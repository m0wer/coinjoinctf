name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regtest node
        run: docker compose up -d
      - run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check src tests demo
          uv run ruff format --check src tests demo
          uv run mypy src
      - name: Wait for the node
        run: |
          for _ in $(seq 30); do
            uv run python -c "from coinjoinctf.rpc import node; node()" && exit 0
            sleep 2
          done
          exit 1
      # ZK tests skip here: building zk/ needs the RISC Zero toolchain (rzup).
      - run: uv run pytest -q
